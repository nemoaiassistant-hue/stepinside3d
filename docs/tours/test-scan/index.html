<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StepInside 3D — Virtual Tour</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        
        #viewer-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        canvas { display: block; width: 100%; height: 100%; }

        .overlay-top {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: auto;
        }

        .brand-name {
            font-size: 18px;
            font-weight: 700;
            color: white;
            letter-spacing: -0.5px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
        }

        .brand-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .back-btn {
            pointer-events: auto;
            color: white;
            text-decoration: none;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .back-btn:hover { background: rgba(255,255,255,0.25); }

        .overlay-bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none;
            z-index: 10;
        }

        .instructions {
            color: rgba(255,255,255,0.7);
            font-size: 13px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
        }

        .loading-screen {
            position: fixed;
            inset: 0;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.5s;
        }

        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(99, 102, 241, 0.2);
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text {
            color: #94a3b8;
            font-size: 14px;
        }

        .loading-title {
            color: white;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <div class="loading-screen" id="loading">
        <div class="brand-icon">🏠</div>
        <div class="loading-title" style="margin-top:16px;">StepInside 3D</div>
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading virtual tour...</div>
    </div>

    <div class="overlay-top">
        <div class="brand">
            <div class="brand-icon">🏠</div>
            <span class="brand-name">StepInside 3D</span>
        </div>
        <a href="https://nemoaiassistant-hue.github.io/stepinside3d/" class="back-btn">← Back to Home</a>
    </div>

    <div id="viewer-container"></div>

    <div class="overlay-bottom">
        <div class="instructions">
            🖱️ Drag to look around · Scroll to zoom · WASD to walk
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "playcanvas": "https://esm.sh/playcanvas@2.7.3",
            "playcanvas/scripts": "https://esm.sh/@playcanvas/scripts@2.7.3"
        }
    }
    </script>

    <script type="module">
        import { AppBase, Color, Entity, GSplatData, GSplatInstance, GSplatResource, GraphicsDevice, 
                 Vec3, BoundingBox, WasmModule, ScriptHandler, 
                 Camera, Render, Lightmap } from 'playcanvas';

        // Initialize the PlayCanvas app
        const canvas = document.createElement('canvas');
        document.getElementById('viewer-container').appendChild(canvas);

        const app = new AppBase(canvas);
        app.init({
            canvas: canvas,
            graphicsDeviceOptions: {
                alpha: false,
                antialias: true
            }
        });

        app.scene.gammaCorrection = 1;
        app.scene.toneMapping = 0;
        app.scene.skyboxIntensity = 0;
        app.renderer.bloomEnabled = false;
        app.scene.ambientLight = new Color(0.5, 0.5, 0.5);

        // Set background to dark
        app.scene.skybox = null;
        app.scene.clearColor = new Color(0.05, 0.05, 0.07, 1);

        // Create camera
        const cameraEntity = new Entity('camera');
        cameraEntity.addComponent('camera', {
            fov: 60,
            nearClip: 0.01,
            farClip: 1000,
            clearColor: new Color(0.05, 0.05, 0.07, 1)
        });
        app.root.addChild(cameraEntity);

        // Add orbit camera controls
        const scriptContainer = new Entity('scripts');
        cameraEntity.addChild(scriptContainer);
        scriptContainer.addComponent('script');

        // Simple mouse orbit
        let yaw = 0, pitch = -10, distance = 5;
        let targetPos = new Vec3(0, 1, 0);
        let isDragging = false, lastX = 0, lastY = 0;

        canvas.addEventListener('mousedown', (e) => { isDragging = true; lastX = e.clientX; lastY = e.clientY; });
        canvas.addEventListener('mouseup', () => isDragging = false);
        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            yaw -= (e.clientX - lastX) * 0.3;
            pitch -= (e.clientY - lastY) * 0.3;
            pitch = Math.max(-89, Math.min(89, pitch));
            lastX = e.clientX;
            lastY = e.clientY;
        });
        canvas.addEventListener('wheel', (e) => {
            distance += e.deltaY * 0.005;
            distance = Math.max(0.5, Math.min(50, distance));
        });

        // Touch support
        let touchStartDist = 0;
        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) { isDragging = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; }
            if (e.touches.length === 2) { touchStartDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); }
        });
        canvas.addEventListener('touchend', () => isDragging = false);
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (e.touches.length === 1 && isDragging) {
                yaw -= (e.touches[0].clientX - lastX) * 0.3;
                pitch -= (e.touches[0].clientY - lastY) * 0.3;
                pitch = Math.max(-89, Math.min(89, pitch));
                lastX = e.touches[0].clientX;
                lastY = e.touches[0].clientY;
            }
            if (e.touches.length === 2) {
                const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                distance += (touchStartDist - d) * 0.02;
                distance = Math.max(0.5, Math.min(50, distance));
                touchStartDist = d;
            }
        }, { passive: false });

        // Load the SOG file
        async function loadSplat() {
            try {
                const response = await fetch('tour.sog');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const arrayBuffer = await response.arrayBuffer();

                // Create splat entity
                const splatEntity = new Entity('splat');
                app.root.addChild(splatEntity);

                // Create GSplat resource from SOG
                const splatResource = new GSplatResource();
                const data = new Uint8Array(arrayBuffer);
                
                // Use GSplatData to parse
                const gsplatData = new GSplatData();
                
                // Create instance component
                splatEntity.addComponent('gsplat', {
                    asset: null
                });

                // For SOG files, use the engine's built-in SOG loader
                const splatInstance = splatEntity.gsplat;
                
                // Load SOG directly
                const compressedData = GSplatData.decodeCompressedSOG(data.buffer);
                
                // Set camera position based on bounding box
                if (compressedData.aabb) {
                    targetPos.set(
                        (compressedData.aabb.min.x + compressedData.aabb.max.x) / 2,
                        (compressedData.aabb.min.y + compressedData.aabb.max.y) / 2,
                        (compressedData.aabb.min.z + compressedData.aabb.max.z) / 2
                    );
                    distance = Math.max(
                        compressedData.aabb.max.x - compressedData.aabb.min.x,
                        compressedData.aabb.max.y - compressedData.aabb.min.y,
                        compressedData.aabb.max.z - compressedData.aabb.min.z
                    ) * 0.8;
                }

                // Hide loading screen
                document.getElementById('loading').classList.add('hidden');

            } catch (err) {
                console.error('Failed to load splat:', err);
                
                // Fallback: use a simple approach with the engine's viewer
                document.querySelector('.loading-text').textContent = 'Loading with fallback renderer...';
                
                try {
                    // Try using SOG with fetch stream LOD
                    const splatEntity = new Entity('splat');
                    app.root.addChild(splatEntity);
                    
                    splatEntity.addComponent('gsplat');
                    await splatEntity.gsplat.load('tour.sog', {
                        type: 'sog'
                    });
                    
                    // Adjust camera
                    const bbox = splatEntity.gsplat.aabb;
                    if (bbox) {
                        targetPos.set((bbox.min.x + bbox.max.x)/2, (bbox.min.y + bbox.max.y)/2, (bbox.min.z + bbox.max.z)/2);
                        distance = Math.max(bbox.max.x - bbox.min.x, bbox.max.y - bbox.min.y, bbox.max.z - bbox.min.z) * 0.8;
                    }
                    
                    document.getElementById('loading').classList.add('hidden');
                } catch(e2) {
                    document.querySelector('.loading-text').textContent = 'Error: ' + e2.message;
                }
            }
        }

        // Camera update
        app.on('update', (dt) => {
            const yawRad = yaw * Math.PI / 180;
            const pitchRad = pitch * Math.PI / 180;
            
            cameraEntity.setPosition(
                targetPos.x + distance * Math.sin(yawRad) * Math.cos(pitchRad),
                targetPos.y + distance * Math.sin(pitchRad),
                targetPos.z + distance * Math.cos(yawRad) * Math.cos(pitchRad)
            );
            cameraEntity.lookAt(targetPos);
        });

        // Start
        app.start();
        loadSplat();
    </script>
</body>
</html>
